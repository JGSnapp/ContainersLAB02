services:
  db:
    image: postgres:15
    container_name: kostenko-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - kostenko-pgdata:/var/lib/postgresql/data
    networks:
      - kostenko-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: kostenko-assistant
    ports:
      - "${APP_PORT}:8008"
    environment:
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CACHE_TTL: ${CACHE_TTL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kostenko-backend

  redis:
    image: redis:7-alpine
    container_name: kostenko-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - kostenko-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  kostenko-pgdata:
    external: true
    name: kostenko-pgdata

networks:
  kostenko-backend:
    external: true
    name: kostenko-backend
